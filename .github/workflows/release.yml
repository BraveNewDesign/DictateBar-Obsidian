name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify version and committed bundle
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const m = require("./manifest.json"), p = require("./package.json"); if (m.version !== process.env.RELEASE_TAG || p.version !== m.version) process.exit(1)'
          git diff --exit-code -- main.js
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" main.js manifest.json styles.css --title "Dictate Bar $RELEASE_TAG" --notes-file RELEASE_NOTES.md --verify-tag
